[system]
input_file = ../data/iob_codes_plus_Acurve_with_ID_LOS.txt
data_dir = data
fit_dir = fits
version_num = 0

[data]
in_param = iob
seed = 0
ntrain = 10_000
nval = 5_000
ntest = 5_000
lambda_V = 5542
npar = 8
fit_log = True
lam_max = 1
lam_min = 0.12

[operon]
allowed_symbols = add,sub,mul,div,sqrt,square,pow,log,constant,variable
epsilon = 1e-3
max_length = 100
time_limit = 3600
objectives=['rmse', 'length']
max_evaluations=1e8
generations=1e8