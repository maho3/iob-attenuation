[system]
input_file = ../data/iob_codes_plus_Acurve_with_ID_LOS.txt
properties_file = ../data/gal_los_iobcomp_attcurve_galprop.dat
data_dir = data
fit_dir = fits
version_num = 0

[data]
in_param = iob
seed = 0
ntrain = 1_000
nval = 500
ntest = 500
lambda_V = 0.5542
npar = 8
fit_log = False
lam_max = 1
lam_min = 0.12

[operon]
allowed_symbols = add,sub,mul,div,sqrt,square,pow,log,constant,variable
epsilon = 1e-3
max_length = 100
time_limit = 3600
objectives=['rmse', 'length']
max_evaluations=1e12
generations=1e12