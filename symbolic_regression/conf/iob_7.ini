[system]
input_file = data/iob_codes_plus_Acurve_with_ID_LOS.txt
data_dir = data
fit_dir = fits
version_num = 7

[data]
in_param = iob
seed = 0
ntrain = 300
nval = 200
ntest = 200
lambda_V = 5542
npar = 4
fit_log = False

[operon]
allowed_symbols = add,sub,mul,div,sqrt,square,pow,log,constant,variable
epsilon = 1e-5
max_length = 100
time_limit = 10800
objectives=['rmse', 'length']
max_evaluations=1e10
generations=1e10
