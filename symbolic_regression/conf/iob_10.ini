[system]
input_file = ../data/gal_los_iobcomp_attcurve_galprop.dat
data_dir = data
fit_dir = fits
version_num = 10

[data]
in_param = iob
seed = 0
ntrain = 1_500
nval = 750
ntest = 750
lambda_V = 0.5542
npar = 8
fit_log = False
lam_max = 1
lam_min = 0.12

[operon]
allowed_symbols = add,sub,mul,div,aq,sqrt,square,exp,log,constant,variable
epsilon = 1e-3
max_length = 50
time_limit = 86400
objectives=['rmse', 'length']
max_evaluations=1e12
generations=1e12